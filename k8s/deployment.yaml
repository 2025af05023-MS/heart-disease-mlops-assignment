apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartlab-api
  labels: {app: heartlab-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: heartlab-api}
  template:
    metadata:
      labels: {app: heartlab-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: heartlab-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: heartlab-api
  labels: {app: heartlab-api}
spec:
  type: LoadBalancer
  selector: {app: heartlab-api}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
